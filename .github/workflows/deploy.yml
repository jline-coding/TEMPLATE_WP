# â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

name: Deploy

on:
  push:
    branches: [master, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Chá»n mÃ´i trÆ°á»ng deploy'
        type: choice
        options:
          - production
          - test
        default: test

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ðŸ“¥ KÃ©o Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      # XÃ¡c Ä‘á»‹nh mÃ´i trÆ°á»ng
      # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: ðŸ” XÃ¡c Ä‘á»‹nh mÃ´i trÆ°á»ng
        run: |
          ENVIRONMENT=""

          if [[ "$GITHUB_REF" == refs/heads/master ]]; then
            ENVIRONMENT="production"
          elif [[ "$GITHUB_REF" == refs/heads/staging ]]; then
            ENVIRONMENT="test"
          fi

          # workflow_dispatch override
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ inputs.environment }}"
          fi

          if [[ -z "$ENVIRONMENT" ]]; then
            echo "âš ï¸ KhÃ´ng xÃ¡c Ä‘á»‹nh Ä‘Æ°á»£c mÃ´i trÆ°á»ng â€” bá» qua."
            exit 0
          fi

          # Äá»c config tá»« deploy-config.json
          DEPLOY_METHOD=$(jq -r ".${ENVIRONMENT}.deploy_method // \"ssh\"" deploy-config.json)
          SERVER_NAME=$(jq -r ".${ENVIRONMENT}.server // empty" deploy-config.json | tr 'a-z' 'A-Z')
          BUILD_CMD=$(jq -r '.build_command // "npm run build"' deploy-config.json)

          # KÃ­ch hoáº¡t tráº¡ng thÃ¡i dá»±a vÃ o deploy_method
          if [[ "$DEPLOY_METHOD" == "ssh" ]]; then
            echo "SHOULD_SSH=true" >> $GITHUB_ENV
          elif [[ "$DEPLOY_METHOD" == "ftp" ]]; then
            echo "SHOULD_FTP=true" >> $GITHUB_ENV
          elif [[ "$DEPLOY_METHOD" == "zip" ]]; then
            echo "SHOULD_ZIP=true" >> $GITHUB_ENV
          else
            echo "âš ï¸ PhÆ°Æ¡ng thá»©c chÆ°a xÃ¡c Ä‘á»‹nh. Chuyá»ƒn hÆ°á»›ng máº·c Ä‘á»‹nh vá» SSH."
            echo "SHOULD_SSH=true" >> $GITHUB_ENV
          fi

          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV
          echo "SERVER_NAME=$SERVER_NAME" >> $GITHUB_ENV
          echo "BUILD_CMD=$BUILD_CMD" >> $GITHUB_ENV

          echo ""
          echo "â•”â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•—"
          printf "â•‘   ðŸš€ Pipeline Deploy [%-24s]â•‘\n" "$ENVIRONMENT"
          printf "â•‘   PhÆ°Æ¡ng thá»©c: %-30sâ•‘\n" "$DEPLOY_METHOD"
          printf "â•‘   Server: %-35sâ•‘\n" "$SERVER_NAME"
          echo "â•šâ•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•"

      # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      # Build
      # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: âš™ï¸ CÃ i Ä‘áº·t Node.js
        if: env.SHOULD_SSH == 'true' || env.SHOULD_FTP == 'true' || env.SHOULD_ZIP == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ðŸ“¦ CÃ i Ä‘áº·t dependencies
        if: env.SHOULD_SSH == 'true' || env.SHOULD_FTP == 'true' || env.SHOULD_ZIP == 'true'
        run: npm install --no-package-lock

      - name: ðŸ’¾ Cache WordPress download
        if: env.SHOULD_SSH == 'true' || env.SHOULD_FTP == 'true' || env.SHOULD_ZIP == 'true'
        uses: actions/cache@v4
        with:
          path: public
          key: wp-public-${{ hashFiles('scripts/download-wp.js', 'deploy-config.json') }}

      - name: ðŸ”¨ Build dá»± Ã¡n
        if: env.SHOULD_SSH == 'true' || env.SHOULD_FTP == 'true' || env.SHOULD_ZIP == 'true'
        run: ${{ env.BUILD_CMD }}
        env:
          DEPLOY_ENV: ${{ env.ENVIRONMENT }}

      # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      # ZIP Mode
      # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: â„¹ï¸ Cháº¿ Ä‘á»™ ZIP (Chá»‰ táº¡o báº£n Build)
        if: env.SHOULD_ZIP == 'true'
        run: echo "Cháº¿ Ä‘á»™ ZIP khÃ´ng cáº§n Ä‘áº©y file qua máº¡ng. HÃ£y táº¡o Tag Ä‘á»ƒ Release code nhÃ©!"

      # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      # Deploy Scripts Options (CÃ i Node Packages)
      # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: ðŸ“¦ CÃ i Ä‘áº·t thÆ° viá»‡n Deploy (FTP / Crypt)
        if: env.SHOULD_FTP == 'true' || env.SHOULD_SSH == 'true'
        run: npm install --no-save basic-ftp apache-crypt

      - name: ðŸš€ Triá»ƒn khai qua FTP
        if: env.SHOULD_FTP == 'true'
        run: node .github/scripts/deploy-ftp.cjs
        env:
          DEPLOY_ENV: ${{ env.ENVIRONMENT }}
          GITHUB_REPO: ${{ github.repository }}
          SERVER_SECRET_JSON: ${{ secrets[format('{0}_CONFIG', env.SERVER_NAME)] }}

      # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      # SSH Deploy
      # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: ðŸš€ Triá»ƒn khai qua SSH/Rsync
        if: env.SHOULD_SSH == 'true'
        run: bash .github/scripts/deploy-ssh.sh
        env:
          DEPLOY_ENV: ${{ env.ENVIRONMENT }}
          GITHUB_REPO: ${{ github.repository }}
          SERVER_SECRET_JSON: ${{ secrets[format('{0}_CONFIG', env.SERVER_NAME)] }}
